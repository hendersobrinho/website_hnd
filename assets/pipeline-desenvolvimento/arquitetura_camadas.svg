<svg width="100%" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Arquitetura em camadas do Museu de Bugs</title>
  <desc>Fluxo da requisição HTTP passando por Controllers, Services, Entities e DTOs até o PostgreSQL.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7ff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="controllersBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0eeff"/>
      <stop offset="100%" stop-color="#e5dfff"/>
    </linearGradient>
    <linearGradient id="servicesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5f9f1"/>
      <stop offset="100%" stop-color="#d0f0e3"/>
    </linearGradient>
    <linearGradient id="entitiesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9e4"/>
      <stop offset="100%" stop-color="#ffebcc"/>
    </linearGradient>
    <linearGradient id="dtosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4ed"/>
      <stop offset="100%" stop-color="#ffe0ce"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000013"/>
    </filter>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a0aabb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a81ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#22a475" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .panel       { fill: url(#panelBg); stroke: #dde1ee; stroke-width: 1; }
      .eyebrow     { font: 700 11px Manrope, Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
      .heading     { font: 700 16px Manrope, Arial, sans-serif; }
      .copy        { font: 400 12.5px Manrope, Arial, sans-serif; }
      .chip        { font: 700 11px Manrope, Arial, sans-serif; }
      .badge-lbl   { font: 600 11px Manrope, Arial, sans-serif; }
      .muted       { fill: #8a91a6; }
      .dark        { fill: #1d2234; }
      .cT          { fill: #4338b2; }
      .sT          { fill: #0f7c59; }
      .eT          { fill: #975b12; }
      .dT          { fill: #b1552f; }
    </style>
  </defs>

  <!-- Background panel -->
  <rect x="20" y="20" width="720" height="380" rx="16" class="panel"/>

  <!-- Header: entry pill + connector arrow -->
  <g transform="translate(68 38)">
    <rect x="0" y="0" width="118" height="24" rx="12" fill="#fff" stroke="#dde1ee"/>
    <text x="59" y="16" text-anchor="middle" class="eyebrow muted">Entrada HTTP</text>
    <line x1="18" y1="26" x2="18" y2="46" stroke="#a0aabb" stroke-width="1.4" marker-end="url(#arrGray)"/>
  </g>

  <!-- Controllers -->
  <g transform="translate(68 80)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="624" height="68" rx="14" fill="url(#controllersBg)" stroke="#7164ea" stroke-width="1.25"/>
    <circle cx="36" cy="34" r="20" fill="#fff" opacity="0.94"/>
    <text x="36" y="40" text-anchor="middle" class="heading cT">{ }</text>
    <text x="72" y="27" class="eyebrow cT">Controllers</text>
    <text x="72" y="48" class="copy cT" opacity="0.84">recebem HTTP, validam entrada e devolvem resposta</text>
    <!-- HTTP method chips -->
    <g transform="translate(366 22)">
      <rect x="0"   y="0" width="38" height="22" rx="11" fill="#fff" opacity="0.9"/>
      <text x="19"  y="15" text-anchor="middle" class="chip cT">GET</text>
      <rect x="44"  y="0" width="44" height="22" rx="11" fill="#fff" opacity="0.9"/>
      <text x="66"  y="15" text-anchor="middle" class="chip cT">POST</text>
      <rect x="94"  y="0" width="34" height="22" rx="11" fill="#fff" opacity="0.9"/>
      <text x="111" y="15" text-anchor="middle" class="chip cT">PUT</text>
      <rect x="134" y="0" width="50" height="22" rx="11" fill="#fff" opacity="0.9"/>
      <text x="159" y="15" text-anchor="middle" class="chip cT">PATCH</text>
      <rect x="190" y="0" width="54" height="22" rx="11" fill="#fff" opacity="0.9"/>
      <text x="217" y="15" text-anchor="middle" class="chip cT">DELETE</text>
    </g>
  </g>

  <!-- Connector: Controllers → Services -->
  <line x1="380" y1="148" x2="380" y2="170" stroke="#8a81ee" stroke-width="1.5" marker-end="url(#arrPurple)"/>

  <!-- Services -->
  <g transform="translate(68 172)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="624" height="68" rx="14" fill="url(#servicesBg)" stroke="#22a475" stroke-width="1.25"/>
    <circle cx="36" cy="34" r="20" fill="#fff" opacity="0.94"/>
    <text x="36" y="40" text-anchor="middle" class="heading sT">&#9881;</text>
    <text x="72" y="27" class="eyebrow sT">Services</text>
    <text x="72" y="48" class="copy sT" opacity="0.84">guardam a lógica de negócio e coordenam o fluxo interno</text>
    <!-- Service chips -->
    <g transform="translate(426 21)">
      <rect x="0"  y="0" width="84" height="24" rx="12" fill="#fff" opacity="0.9"/>
      <text x="42" y="16.5" text-anchor="middle" class="chip sT">BugService</text>
      <rect x="90" y="0" width="92" height="24" rx="12" fill="#fff" opacity="0.9"/>
      <text x="136" y="16.5" text-anchor="middle" class="chip sT">AuthService</text>
    </g>
  </g>

  <!-- Connector: Services → bottom row -->
  <line x1="380" y1="240" x2="380" y2="262" stroke="#22a475" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <!-- Entities -->
  <g transform="translate(68 264)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="286" height="72" rx="14" fill="url(#entitiesBg)" stroke="#d08b23" stroke-width="1.25"/>
    <circle cx="36" cy="36" r="20" fill="#fff" opacity="0.94"/>
    <text x="36" y="42" text-anchor="middle" class="heading eT">&#9638;</text>
    <text x="72" y="28" class="eyebrow eT">Entities</text>
    <text x="72" y="50" class="copy eT" opacity="0.84">representam as tabelas do banco</text>
  </g>

  <!-- DTOs -->
  <g transform="translate(406 264)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="286" height="72" rx="14" fill="url(#dtosBg)" stroke="#db7047" stroke-width="1.25"/>
    <circle cx="36" cy="36" r="20" fill="#fff" opacity="0.94"/>
    <text x="36" y="42" text-anchor="middle" class="heading dT">&#8644;</text>
    <text x="72" y="28" class="eyebrow dT">DTOs</text>
    <text x="72" y="50" class="copy dT" opacity="0.84">carregam dados entre camadas</text>
  </g>

  <!-- PostgreSQL badge (below Entities, centered) -->
  <g transform="translate(211 338)">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#a0aabb" stroke-width="1.2" marker-end="url(#arrGray)"/>
    <rect x="-46" y="16" width="92" height="22" rx="11" fill="#eceae6" stroke="#a8a39b" stroke-width="0.8"/>
    <text x="0" y="31.5" text-anchor="middle" class="badge-lbl muted">PostgreSQL</text>
  </g>
</svg>
