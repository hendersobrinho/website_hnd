<svg width="100%" viewBox="0 0 680 146" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Fluxo do pipeline de desenvolvimento</title>
  <desc>Quatro etapas em sequência: Código, Build, Testes, Deploy</desc>
  <defs>
    <linearGradient id="gCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede8ff"/>
      <stop offset="100%" stop-color="#d8d0ff"/>
    </linearGradient>
    <linearGradient id="gBuild" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcf9ee"/>
      <stop offset="100%" stop-color="#baf0d8"/>
    </linearGradient>
    <linearGradient id="gTest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="100%" stop-color="#ffe0a0"/>
    </linearGradient>
    <linearGradient id="gDeploy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffede4"/>
      <stop offset="100%" stop-color="#ffc8b0"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-10%" width="116%" height="132%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000016"/>
    </filter>
    <marker id="arrCode" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6350e8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrBuild" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#18996a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrTest" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c07a10" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .lbl  { font: 700 14px Manrope, Arial, sans-serif; }
      .sub  { font: 400 11px Manrope, Arial, sans-serif; }
      .num  { font: 800 9px Manrope, Arial, sans-serif; letter-spacing: 0.04em; }
      .loop { font: 400 11px Manrope, Arial, sans-serif; fill: #9aa0b4; }
      .cT   { fill: #3626b0; } .cS { fill: #6350e8; }
      .bT   { fill: #0a5e40; } .bS { fill: #18996a; }
      .tT   { fill: #7a4d00; } .tS { fill: #c07a10; }
      .dT   { fill: #852010; } .dS { fill: #d04e32; }
    </style>
  </defs>

  <!-- Código -->
  <g filter="url(#cardShadow)">
    <rect x="38" y="22" width="130" height="72" rx="12" fill="url(#gCode)" stroke="#6350e8" stroke-width="1.4"/>
  </g>
  <rect x="50" y="30" width="20" height="14" rx="7" fill="#6350e8" opacity="0.18"/>
  <text x="60" y="40" text-anchor="middle" dominant-baseline="central" class="num cT">01</text>
  <text x="103" y="53" text-anchor="middle" dominant-baseline="central" class="lbl cT">Código</text>
  <text x="103" y="72" text-anchor="middle" dominant-baseline="central" class="sub cS">planejar e escrever</text>

  <!-- Arrow: Código → Build -->
  <line x1="168" y1="58" x2="194" y2="58" stroke="#6350e8" stroke-width="1.6" marker-end="url(#arrCode)"/>

  <!-- Build -->
  <g filter="url(#cardShadow)">
    <rect x="196" y="22" width="130" height="72" rx="12" fill="url(#gBuild)" stroke="#18996a" stroke-width="1.4"/>
  </g>
  <rect x="208" y="30" width="20" height="14" rx="7" fill="#18996a" opacity="0.18"/>
  <text x="218" y="40" text-anchor="middle" dominant-baseline="central" class="num bT">02</text>
  <text x="261" y="53" text-anchor="middle" dominant-baseline="central" class="lbl bT">Build</text>
  <text x="261" y="72" text-anchor="middle" dominant-baseline="central" class="sub bS">compilar</text>

  <!-- Arrow: Build → Testes -->
  <line x1="326" y1="58" x2="352" y2="58" stroke="#18996a" stroke-width="1.6" marker-end="url(#arrBuild)"/>

  <!-- Testes -->
  <g filter="url(#cardShadow)">
    <rect x="354" y="22" width="130" height="72" rx="12" fill="url(#gTest)" stroke="#c07a10" stroke-width="1.4"/>
  </g>
  <rect x="366" y="30" width="20" height="14" rx="7" fill="#c07a10" opacity="0.18"/>
  <text x="376" y="40" text-anchor="middle" dominant-baseline="central" class="num tT">03</text>
  <text x="419" y="53" text-anchor="middle" dominant-baseline="central" class="lbl tT">Testes</text>
  <text x="419" y="72" text-anchor="middle" dominant-baseline="central" class="sub tS">validar</text>

  <!-- Arrow: Testes → Deploy -->
  <line x1="484" y1="58" x2="510" y2="58" stroke="#c07a10" stroke-width="1.6" marker-end="url(#arrTest)"/>

  <!-- Deploy -->
  <g filter="url(#cardShadow)">
    <rect x="512" y="22" width="130" height="72" rx="12" fill="url(#gDeploy)" stroke="#d04e32" stroke-width="1.4"/>
  </g>
  <rect x="524" y="30" width="20" height="14" rx="7" fill="#d04e32" opacity="0.18"/>
  <text x="534" y="40" text-anchor="middle" dominant-baseline="central" class="num dT">04</text>
  <text x="577" y="53" text-anchor="middle" dominant-baseline="central" class="lbl dT">Deploy</text>
  <text x="577" y="72" text-anchor="middle" dominant-baseline="central" class="sub dS">publicar</text>

  <!-- Feedback loop -->
  <path d="M 577 94 Q 577 126 340 126 Q 103 126 103 94" fill="none" stroke="#c0c6d6" stroke-width="1" stroke-dasharray="5 3"/>
  <rect x="290" y="119" width="100" height="14" rx="7" fill="#f6f7fa"/>
  <text x="340" y="126" text-anchor="middle" dominant-baseline="central" class="loop">&#8635; ciclo contínuo</text>
</svg>
